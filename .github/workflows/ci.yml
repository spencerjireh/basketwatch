# The PR gate: the same list as `just check`, plus prettier. Turbo's ^build
# dependency builds @basketwatch/contract before typecheck/lint/test, so there
# is no separate build-first step. Tests are pure vitest -- no database, no
# service containers.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: it reads `packageManager` from the root
      # package.json, so the pin lives in exactly one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Not --ignore-scripts: pnpm-workspace.yaml's onlyBuiltDependencies
      # (esbuild, sharp, ...) need their postinstall builds to run.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
