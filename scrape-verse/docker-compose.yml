services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scrapeverse
      POSTGRES_PASSWORD: scrapeverse
      POSTGRES_DB: scrapeverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapeverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://scrapeverse:scrapeverse@postgres:5432/scrapeverse
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

  clone-store:
    build: ./apps/clone-store
    ports:
      - "3002:3002"

volumes:
  pgdata:
