# The Coolify deployment unit: point Coolify's Docker Compose resource at
# this file. Postgres stays on the internal network (no host port).
# Secrets come from Coolify-managed env vars.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scrapeverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Coolify env}
      POSTGRES_DB: scrapeverse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapeverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scrapeverse:${POSTGRES_PASSWORD}@postgres:5432/scrapeverse
      BRIGHTDATA_API_KEY: ${BRIGHTDATA_API_KEY}
      BRIGHTDATA_WEBHOOK_SECRET: ${BRIGHTDATA_WEBHOOK_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      HEAL_MAX_ATTEMPTS_PER_INCIDENT: ${HEAL_MAX_ATTEMPTS_PER_INCIDENT:-3}
      HEAL_MAX_PER_SCRAPER_PER_DAY: ${HEAL_MAX_PER_SCRAPER_PER_DAY:-5}
      CREDIT_DAILY_CEILING_USD: ${CREDIT_DAILY_CEILING_USD:-5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  clone-store:
    build:
      context: .
      dockerfile: apps/clone-store/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${CLONE_ADMIN_TOKEN:?set in Coolify env}
      LAYOUT: ${CLONE_LAYOUT:-a}
    ports:
      - "3002:3002"

volumes:
  pgdata:
