# Local development: only backing services in Docker.
# Apps run on the host with hot reload (npm run dev:api / dev:web / dev:clone).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scrapeverse
      POSTGRES_PASSWORD: scrapeverse
      POSTGRES_DB: scrapeverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapeverse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
